<style>
/* The no-JS success path (Formspree _next → /thanks). Same tokens as the home page. */
:root{
  --deep:#152017; --forest:#1C2B1E; --sage-light:#C8D9C4; --mist:#F0F4EF;
  --on-dark:#F0F4EF; --on-dark-mute:#AFC0AE; --line-dark:rgba(200,217,196,.14);
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;background:var(--deep);color:var(--on-dark);font:16px/1.6 var(--body);display:grid;grid-template-rows:auto 1fr auto}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sage-light);outline-offset:3px;border-radius:6px}
.nav{padding-block:18px}
.logo{display:inline-flex;align-items:center;gap:9px;letter-spacing:-.02em}
.logo svg{width:32px;height:32px;overflow:visible}
.mk{fill:#6FA585}.mk .fr{fill:none;stroke:#6FA585;stroke-width:.32px}
main{padding-block:48px 72px;display:grid;align-content:start}
.card{background:var(--forest);border-radius:20px;padding:28px;box-shadow:inset 0 0 0 1px var(--line-dark);display:grid;gap:20px}
h1{margin:0;font:700 clamp(30px,6vw,40px)/1.08 var(--display);letter-spacing:-.03em}
.lead{font-size:17px;color:var(--on-dark-mute)}
.step2{display:grid;gap:16px;border-top:1px solid var(--line-dark);padding-top:20px}
.step2 h2{margin:0;font:600 16px var(--body)}
.hint{font-size:14px;color:var(--on-dark-mute);font-weight:400}
.q{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.q legend{font:500 14px var(--body);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;box-shadow:inset 0 0 0 1px rgba(200,217,196,.3);transition:background-color 150ms,box-shadow 150ms}
.chip input:checked + span{background:var(--sage-light);color:var(--forest);box-shadow:none}
.chip input:focus-visible + span{outline:2px solid var(--sage-light);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border-radius:999px;font:600 14px var(--body);border:0;cursor:pointer;background:var(--sage-light);color:var(--forest);transition:scale 150ms var(--ease)}
.btn:active{scale:.97}
.sent{font-size:15px;color:var(--on-dark-mute)}
.back{justify-self:start;font-size:15px;color:var(--sage-light);text-decoration:underline;text-decoration-color:rgba(200,217,196,.45);text-underline-offset:.22em}
footer{padding-block:24px;font-size:14px;color:var(--on-dark-mute);border-top:1px solid var(--line-dark)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.arrive{display:flex;align-items:center;gap:14px}
.ant-in{width:30px;height:42px;color:#6FA585;flex:none;animation:ant-in 1.4s cubic-bezier(.2,0,0,1) both}
.crumb-f{fill:#C8D9C4}
@keyframes ant-in{from{transform:translateX(-46px) rotate(90deg);opacity:0}70%{transform:translateX(0) rotate(90deg);opacity:1}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ant-in{animation:none}}
</style>
